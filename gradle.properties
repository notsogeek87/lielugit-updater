org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# Maven coordinates:  GROUP:ARTIFACT_ID:VERSION_NAME
#   implementation("com.lielu:lielugit-updater:1.0.0")
#
# VERSION_NAME is the single source of truth for the library version. The
# release workflow overrides it from the Git tag (v1.2.3 -> 1.2.3) using
#   -PVERSION_NAME=1.2.3
# ---------------------------------------------------------------------------
GROUP=com.lielu
ARTIFACT_ID=lielugit-updater
VERSION_NAME=1.0.0-SNAPSHOT

POM_NAME=LieluGit Updater
POM_DESCRIPTION=Headless Android library that checks GitHub Releases for a newer APK, downloads it and hands it to the system installer.
POM_URL=https://github.com/notsogeek87/lielugit-updater
POM_SCM_URL=https://github.com/notsogeek87/lielugit-updater
POM_SCM_CONNECTION=scm:git:git://github.com/notsogeek87/lielugit-updater.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/notsogeek87/lielugit-updater.git
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_DEVELOPER_ID=notsogeek87
POM_DEVELOPER_NAME=notsogeek87

# Remote Maven repository targeted by the `GitHubPackages` repository (see README, "Publishing").
# Credentials are read from GITHUB_ACTOR / GITHUB_TOKEN; nothing is stored in the repo.
PUBLISH_REPO_URL=https://maven.pkg.github.com/notsogeek87/lielugit-updater
